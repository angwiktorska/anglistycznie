/* BLOG – najnowszy wpis na górze. data: "RRRR-MM-DD" albo "RRRR-MM".

  {

    data: "2024-03-07",

    tresc: "",
    material: null
  },
  {

    tytul: "Food quantifiers",
    data: "2023-11",
    kategorie: ["food", "quantifiers", "countable", "uncountable", "a few", "a little"],
    okladka: "", kolor: "#FBE0B8",
    zajawka: "Hej :) Jak Ci mija końcówka października? Czy już z wytęsknieniem wyczekujesz przerwy świątecznej?",
    tresc: "",
    material: null
  }
];

/* DARMOWE MATERIAŁY – plik: wrzuć PDF do folderu "materialy" i wpisz jego nazwę */
window.MATERIALY = [
  { tytul: "Tenses revision", dzial: "Gramatyka", opis: "Powtórka czasów w jednym miejscu – do druku.", plik: "materialy/tenses-revision.pdf", okladka: "", kolor: "#F6D5E0" }
];

/* SKLEP – link: adres strony płatności (Payhip, Stripe, Gumroad…). Bez linku przycisk prowadzi do Kontaktu. */
window.PRODUKTY = [
  { tytul: "Wild Animals Mega Pack", cena: "25 zł", opis: "Duża paczka materiałów o dzikich zwierzętach.", link: "", okladka: "", kolor: "#D9E8C8" }
];

/* KARTKÓWKA NA STRONIE GŁÓWNEJ – "___" to miejsce na odpowiedź, dobra: numer poprawnej odpowiedzi (liczony od 0).
   Pusta lista [] = sekcja znika. */
window.KARTKOWKA = [
  { temat: "farm animals", pytanie: "A baby cow is called a ___.",        odp: ["calf", "lamb", "kid"],        dobra: 0 },

<style>
/* Layout: blush paper, plum ink, London-bus red as the one loud accent. Wide editorial column (1160px), cards as printed worksheets. */

.pen-u path{fill:none;stroke:var(--bus);stroke-width:5px;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s .6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rot{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-weight:600;color:var(--muted);min-height:48px}
#rot{font-size:42px;display:inline-block;transform:rotate(-2deg)}
#rot.swap{animation:swap .45s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes swap{from{opacity:0;translate:0 14px}}
.desk{transform:perspective(1000px) rotateY(calc(var(--mx,0)*9deg)) rotateX(calc(var(--my,0)*-7deg));transition:transform .25s ease-out}
.sheet{box-shadow:0 30px 60px -28px rgb(47 39 41 / .55),0 2px 0 var(--line)}
.card{border-radius:14px;box-shadow:0 26px 44px -38px rgb(47 39 41 / .55)}
.price{position:relative;padding:2px 14px}
.price::after{content:"";position:absolute;inset:-3px -2px;border:2.5px solid var(--bus);border-radius:50%;transform:rotate(-5deg)}
.about blockquote{font-size:clamp(24px,3vw,36px);line-height:1.3}
.about .portrait img{width:min(66%,216px);background:#fff;padding:20px 16px;border-radius:14px;transform:rotate(-4deg);box-shadow:0 22px 34px -22px rgb(47 39 41 / .55)}
.about .portrait::before{content:"Hello!";position:absolute;top:15%;left:0;right:0;text-align:center;font-family:var(--f-hand);font-weight:700;font-size:clamp(44px,6vw,64px);line-height:1;color:var(--bus);transform:rotate(-6deg)}
.about .portrait{place-items:center;padding-top:18%}

/* czerwona taśma z tematami */
.strip-w{overflow:hidden;padding-block:16px 10px}
.strip{background:var(--bus);transform:rotate(-1.2deg);margin-inline:-24px;padding:13px 0}
.track{display:flex;width:max-content;animation:slide 40s linear infinite}
.strip:hover .track{animation-play-state:paused}
.track a{position:relative;color:var(--ink);text-decoration:none;font-family:var(--f-display);font-size:22px;padding:0 24px;white-space:nowrap}
.track a::after{content:"";position:absolute;right:-4px;top:52%;width:7px;height:7px;border-radius:50%;background:#fff}
.track a:hover{text-decoration:underline}
@keyframes slide{to{transform:translateX(-50%)}}

/* kartkówka */
.quiz-sec{background:var(--blush-2)}
.quiz{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(28px,5vw,64px);align-items:center}
.qtext{display:flex;flex-direction:column;gap:14px}
@media (max-width:820px){.quiz{grid-template-columns:1fr}}
.qsheet{position:relative;min-height:330px;padding:26px 24px 22px 58px;border-radius:6px;transform:rotate(-1.2deg);box-shadow:0 34px 60px -34px rgb(47 39 41 / .6),0 1px 0 var(--line);
  background:linear-gradient(90deg,transparent 42px,#f1b3c2 42px,#f1b3c2 43.5px,transparent 43.5px),repeating-linear-gradient(#fff 0 33px,#e6edf8 33px 34px)}
.qsheet::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:16px;background:radial-gradient(circle,var(--blush-2) 0 7px,transparent 8px) 0 34px/16px 96px repeat-y}
.qhead{display:flex;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:14px}
.qhead i{font-family:var(--f-hand);font-style:normal;font-size:24px;line-height:1;color:#2C55E0;border-bottom:1.5px dotted var(--muted);padding:0 12px}
.qno{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
.qq{font-family:var(--f-display);font-size:clamp(22px,2.7vw,32px);line-height:1.55;margin:10px 0 20px}
.gap{display:inline-block;min-width:112px;border-bottom:2.5px solid var(--ink);text-align:center;font-family:var(--f-hand);font-size:1.3em;line-height:.9;padding:0 8px;color:#2C55E0}
.gap.bad{color:var(--bus)}
.gap.bad s{color:#2C55E0;text-decoration-color:var(--bus);text-decoration-thickness:3px}
.qopts{display:flex;gap:10px;flex-wrap:wrap}
.qopts .btn{font-size:17px;padding:9px 20px}
.qopts .btn:disabled{cursor:default;transform:none;box-shadow:none;opacity:.55}
.qopts .btn.right{opacity:1;background:#E3F4E6;border-color:#2C7A3F;color:#1D5A2C}
.qopts .btn.wrong{opacity:1;border-color:var(--bus-ink);color:var(--bus-ink);text-decoration:line-through}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;min-height:48px}
.qfb{font-size:38px;transform:rotate(-3deg);display:inline-block;animation:swap .4s cubic-bezier(.2,.8,.3,1.3) both}
.qres{display:grid;gap:16px;justify-items:center;text-align:center;padding:14px 0}
.grade{font-family:var(--f-hand);font-weight:700;font-size:88px;line-height:1;color:var(--bus);padding:8px 30px 14px;border:4px solid var(--bus);border-radius:50%;transform:rotate(-6deg);display:inline-block;animation:swap .5s cubic-bezier(.2,.8,.3,1.3) both}

/* autobus przed stopką */
.road{position:relative;height:128px;overflow:hidden}
.road::after{content:"";position:absolute;left:0;right:0;bottom:12px;border-bottom:3px dashed var(--rose)}
.road .bus{position:absolute;bottom:6px;right:max(24px,6vw);width:172px;transform:translateX(-120vw)}
.road .wh{transform-box:fill-box;transform-origin:center}
.road.go .wh{animation:spin .55s linear 6}
@keyframes spin{to{transform:rotate(360deg)}}
.road.parked .bus{transform:none}
.road.go .bus{animation:drive 3.4s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes drive{to{transform:none}}
.road .bye{position:absolute;right:calc(max(24px,6vw) + 188px);bottom:48px;font-size:36px;opacity:0;transform:rotate(-4deg);transition:opacity .5s 3.1s}
.road.go .bye,.road.parked .bye{opacity:1}
@media (prefers-reduced-motion:reduce){.pen-u path{stroke-dashoffset:0}.road .bus{transform:none}.road .bye{opacity:1}}
</style>
<div id="app"></div>
<script>
(function(){
"use strict";

var app=document.getElementById('app');

var ICON={
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  fb:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 22v-8h2.7l.4-3.2h-3.1V8.8c0-.9.3-1.5 1.6-1.5h1.7V4.4c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.3H7.4V14h2.7v8h3.4z"/></svg>',
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.2" fill="currentColor" stroke="none"/></svg>',
  dl:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>'
};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function fdate(d){var p=String(d||'').split('-');if(p.length<2)return '';var m=+p[1]-1;return p[2]?(+p[2])+' '+MIES_D[m]+' '+p[0]:MIES[m]+' '+p[0];}
function cover(it,cls){
  if(it.okladka)return '<img class="cover-img'+(cls?' '+cls:'')+'" src="'+esc(it.okladka)+'" alt="'+esc(it.tytul)+'" loading="lazy">';
  var words=it.tytul.split(/\s[–-]\s/)[0];
  return '<div class="cv'+(cls?' '+cls:'')+'" style="background:'+esc(it.kolor||'#F6D5E0')+'"><b>'+esc(words)+'</b><small>Anglistycznie</small></div>';
}
function social(cls){
  var o='';
  if(S.facebook)o+='<a class="soc" href="'+esc(S.facebook)+'" target="_blank" rel="noopener">'+ICON.fb+'Facebook</a>';
  if(S.instagram)o+='<a class="soc" href="'+esc(S.instagram)+'" target="_blank" rel="noopener">'+ICON.ig+'Instagram</a>';
  return o?'<div class="social '+(cls||'')+'">'+o+'</div>':'';
}
function postCard(w){
  return '<a class="card" href="#wpis-'+esc(w.slug)+'">'+cover(w)+'<div class="body"><span class="meta">'+fdate(w.data)+'</span><h3>'+esc(w.tytul)+'</h3><p class="meta" style="font-size:16px">'+esc(w.zajawka)+'</p><div class="foot"><span class="more">Czytaj dalej →</span></div></div></a>';
}
function matCard(m){
  return '<div class="card hov">'+cover(m)+'<div class="body"><span class="eyebrow">'+esc(m.dzial||'Materiał')+'</span><h3>'+esc(m.tytul)+'</h3>'+(m.opis?'<p class="meta" style="font-size:16px">'+esc(m.opis)+'</p>':'')+'<div class="foot"><span class="meta">PDF · za darmo</span>'+(m.plik?'<a class="btn sm red" href="'+esc(m.plik)+'" download>'+ICON.dl+'Pobierz</a>':'')+'</div></div></div>';
}
function prodCard(p){
  var buy=p.link?'<a class="btn sm red" href="'+esc(p.link)+'" target="_blank" rel="noopener">Kup teraz</a>':'<a class="btn sm red" href="#kontakt" data-subject="Zamówienie: '+esc(p.tytul)+'">Zamów</a>';

}
function mini(it,href,right){return '<a class="mini" href="'+href+'"><div class="th">'+cover(it)+'</div><div><b style="font-family:var(--f-display);font-weight:400;font-size:19px">'+esc(it.tytul)+'</b><div class="meta" style="font-size:14px;color:var(--muted)">'+right+'</div></div></a>';}

/* ---------- views ---------- */

     '<div class="panel free"><span class="eyebrow">Za darmo</span><h2>Pobierz i drukuj</h2><p class="lead">Karty pracy, które możesz od razu wykorzystać na lekcji.</p><div class="stack" style="display:flex;flex-direction:column;gap:10px">'+M.slice(0,3).map(function(m){return mini(m,'#materialy',esc(m.dzial||'')+' · PDF');}).join('')+'</div><div><a class="btn" href="#materialy">Wszystkie darmowe materiały →</a></div></div>'+

function vMaterials(cat){

function allTags(){var t={};W.forEach(function(w){(w.kategorie||[]).forEach(function(k){t[k]=(t[k]||0)+1;});});return Object.keys(t).sort();}
function archive(){var a={},order=[];W.forEach(function(w){var k=String(w.data).slice(0,7);if(!a[k]){a[k]=0;order.push(k);}a[k]++;});return order.map(function(k){return [k,a[k]];});}
function vBlog(filter){

function vPost(s){
  var i=-1;W.forEach(function(w,k){if(w.slug===s)i=k;});if(i<0)return vBlog();
  var w=W[i], paras=String(w.tresc||'').trim()?String(w.tresc).trim().split(/\n\s*\n/):[w.zajawka];

  o+='<div class="cover">'+cover(w)+'</div><div class="text">'+paras.map(function(p){return '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>';}).join('')+'</div>';

  return o+'</article></div>';
}
function vAbout(){
  return '<div class="wrap"><div class="about" style="padding-block:56px 72px"><div class="portrait"><img src="img/logo.png" alt="Logo Anglistycznie z Angie"></div><div style="display:flex;flex-direction:column;gap:20px"><span class="hand" style="font-size:44px">Hej!</span><h1>Witam Cię na blogu Anglistycznie :)</h1>'+
    O_MNIE.map(function(p){return '<p style="font-size:20px;line-height:1.7">'+esc(p)+'</p>';}).join('')+'<span class="sig">Angie</span>'+social()+'</div></div></div>';
}
function vContact(subject){
  var o='<div class="wrap"><div class="phead"><span class="hand">napisz!</span><h1>Kontakt</h1><p class="lead">Pytanie o materiał, współpraca albo po prostu „hej” – chętnie odpiszę.</p></div><div class="contact" style="padding-block:20px 72px"><div style="display:flex;flex-direction:column;gap:22px">';
  if(S.email)o+='<div><span class="eyebrow">E-mail</span><p class="mail"><a href="mailto:'+esc(S.email)+'">'+esc(S.email)+'</a></p></div>';
  o+=(social()?'<div style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Social media</span>'+social()+'</div>':'')+'</div>';
  if(S.email&&S.formularz){
    o+='<form class="form" id="cf" action="https://formsubmit.co/'+esc(S.email)+'" method="POST"><input type="hidden" name="_subject" id="cf-sub" value="'+esc(subject||'Wiadomość ze strony Anglistycznie')+'"><input type="hidden" name="_next" id="cf-next" value=""><input type="hidden" name="_template" value="table">'+
      '<input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">'+
      '<label>Imię<input name="imie" id="cf-name" required autocomplete="name"></label><label>Twój e-mail<input name="email" id="cf-mail" type="email" required autocomplete="email"></label>'+
      '<label>Wiadomość<textarea name="wiadomosc" id="cf-msg" rows="6" required>'+(subject?esc(subject)+'\n\n':'')+'</textarea></label><button class="btn red" type="submit" style="align-self:flex-start">Wyślij wiadomość</button></form>';
  } else if(!S.email&&!social()) o+='<div class="empty">Dane kontaktowe pojawią się wkrótce.</div>';
  return o+'</div></div>';
}
function vThanks(){return '<div class="wrap"><div class="phead" style="padding-bottom:120px"><span class="hand">dzięki!</span><h1>Wiadomość wysłana</h1><p class="lead">Odpiszę najszybciej, jak się da.</p><p><a class="btn" href="#">Wróć na stronę główną</a></p></div></div>';}

/* ---------- shell ---------- */
var NAV=[['','Start'],['materialy','Darmowe materiały'],['sklep','Sklep'],['blog','Blog'],['o-mnie','O mnie'],['kontakt','Kontakt']];
function shell(route,body){
  var sec=route.split('-')[0]; if(sec==='wpis'||sec==='kategoria'||sec==='archiwum')sec='blog';
  var o=W[0]?'<div class="ann">Nowe na blogu: <a href="#wpis-'+esc(W[0].slug)+'">'+esc(W[0].tytul)+'</a></div>':'';
  o+='<header class="top"><div class="wrap"><a class="logo" href="#" aria-label="Anglistycznie z Angie – strona główna"><img src="img/logo.png" alt="Anglistycznie z Angie"></a>'+
    '<nav class="main" id="nav">'+NAV.map(function(n){return '<a href="#'+n[0]+'"'+(sec===n[0]||(n[0]===''&&sec==='')?' class="on"':'')+'>'+n[1]+'</a>';}).join('')+(S.strefaUcznia?'<a class="btn sm red" href="'+esc(S.strefaUcznia)+'" style="margin-left:6px">Strefa ucznia</a>':'')+'</nav>'+
    (S.facebook?'<a class="icon-btn hs-first" href="'+esc(S.facebook)+'" target="_blank" rel="noopener" aria-label="Facebook">'+ICON.fb+'</a>':'')+
    (S.instagram?'<a class="icon-btn'+(S.facebook?'':' hs-first')+'" href="'+esc(S.instagram)+'" target="_blank" rel="noopener" aria-label="Instagram">'+ICON.ig+'</a>':'')+
    '<button class="icon-btn" data-a="search" aria-label="Szukaj">'+ICON.search+'</button><button class="icon-btn burger" data-a="menu" aria-label="Menu" aria-controls="nav" aria-expanded="false">'+ICON.menu+'</button></div></header>';
  o+='<main>'+body+'</main>';
  o+=BUS+'<footer><div class="wrap"><div class="cols"><div style="display:flex;flex-direction:column;gap:18px"><img src="img/logo-jasne.png" alt="Anglistycznie z Angie" style="width:200px">'+social()+'</div>'+
    '<div><h4>Strona</h4><ul>'+NAV.map(function(n){return '<li><a href="#'+n[0]+'">'+n[1]+'</a></li>';}).join('')+(S.strefaUcznia?'<li><a href="'+esc(S.strefaUcznia)+'">Strefa ucznia</a></li>':'')+'</ul></div></div>'+
    '<div class="legal"><span>© '+new Date().getFullYear()+' Anglistycznie z Angie'+(S.stopka?' · '+esc(S.stopka):'')+'</span><span class="row" style="gap:18px">'+(S.polityka?'<a href="'+esc(S.polityka)+'">Polityka prywatności</a>':'')+(S.regulamin?'<a href="'+esc(S.regulamin)+'">Regulamin</a>':'')+'</span></div></div></footer>';
  return o;
}
var pendingSubject='';
function route(){
  var h=decodeURIComponent((location.hash||'').replace(/^#/,'')), body;
  if(!h||h==='start')body=vHome();
  else if(h==='materialy')body=vMaterials('');
  else if(h.indexOf('materialy-')===0){var c=null;M.forEach(function(m){if(slug(m.dzial||'')===h.slice(10))c=m.dzial;});body=vMaterials(c||'');}
  else if(h==='sklep')body=vShop();
  else if(h==='blog')body=vBlog(null);
  else if(h.indexOf('kategoria-')===0)body=vBlog({t:'kat',v:h.slice(10)});
  else if(h.indexOf('archiwum-')===0)body=vBlog({t:'arch',v:h.slice(9)});
  else if(h.indexOf('wpis-')===0)body=vPost(h.slice(5));
  else if(h==='o-mnie')body=vAbout();
  else if(h==='kontakt'){body=vContact(pendingSubject);pendingSubject='';}
  else if(h==='dziekuje')body=vThanks();
  else body=vHome();
  app.innerHTML=shell(h,body);
  window.scrollTo(0,0);
  enhance();
  var t=h.indexOf('wpis-')===0?(W.filter(function(w){return w.slug===h.slice(5);})[0]||{}).tytul:null;
  document.title=(t?t+' – ':'')+'Anglistycznie z Angie';
}
/* search */
function openSearch(){
  var d=document.createElement('div');d.className='search';d.innerHTML='<div class="box" role="dialog" aria-label="Szukaj"><input id="sq" placeholder="Szukaj: np. animals, quantifiers…" autocomplete="off"><div class="sres" id="sr"></div></div>';
  document.body.appendChild(d);var q=d.querySelector('#sq');q.focus();
  function draw(){var v=q.value.trim().toLowerCase(),r=[];
    if(v){W.forEach(function(w){if((w.tytul+' '+w.zajawka+' '+(w.kategorie||[]).join(' ')).toLowerCase().indexOf(v)>=0)r.push(['Blog',w.tytul,'#wpis-'+w.slug]);});
      M.forEach(function(m){if((m.tytul+' '+(m.dzial||'')+' '+(m.opis||'')).toLowerCase().indexOf(v)>=0)r.push(['Za darmo',m.tytul,'#materialy']);});
      P.forEach(function(p){if((p.tytul+' '+(p.opis||'')).toLowerCase().indexOf(v)>=0)r.push(['Sklep',p.tytul+' · '+p.cena,'#sklep']);});}
    d.querySelector('#sr').innerHTML=!v?'<p style="color:var(--muted);padding:6px 10px">Wpisz temat, słówko albo nazwę materiału.</p>':r.length?r.map(function(x){return '<a href="'+x[2]+'"><span class="k">'+x[0]+'</span><span>'+esc(x[1])+'</span></a>';}).join(''):'<p style="color:var(--muted);padding:6px 10px">Nic nie znalazłam. Spróbuj innego słowa.</p>';}
  q.addEventListener('input',draw);draw();
  d.addEventListener('click',function(e){if(e.target===d||e.target.closest('a'))d.remove();});
  d.addEventListener('keydown',function(e){if(e.key==='Escape')d.remove();});
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');
  if(b&&b.dataset.a==='search')openSearch();
  if(b&&b.dataset.a==='menu'){var n=document.getElementById('nav');n.classList.toggle('open');b.setAttribute('aria-expanded',n.classList.contains('open'));}
  var s=e.target.closest('[data-subject]');if(s)pendingSubject=s.getAttribute('data-subject');
});
document.addEventListener('submit',function(e){
  if(e.target.id==='cf'){var n=document.getElementById('cf-next');n.value=location.href.split('#')[0]+'#dziekuje';}
});
/* ---------- premium: ruch i kartkówka ---------- */
var Q=window.KARTKOWKA||[], rotT=0, qi=0, score=0, RM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
var BUS='<div class="road" id="road" aria-hidden="true"><span class="hand bye">See you!</span><svg class="bus" viewBox="0 0 184 108">'+
  '<ellipse cx="92" cy="101" rx="80" ry="4" fill="#2F2729" opacity=".13"/>'+
  '<rect x="6" y="8" width="172" height="78" rx="15" fill="#E0607E"/><rect x="6" y="8" width="172" height="40" rx="15" fill="#E87391"/><rect x="6" y="34" width="172" height="14" fill="#E87391"/>'+
  '<rect x="14" y="11" width="156" height="4" rx="2" fill="#F6A9BC"/>'+
  '<rect x="6" y="45" width="172" height="8" fill="#FFF4F7"/><text x="92" y="51.3" text-anchor="middle" font-family="Figtree,Arial,sans-serif" font-weight="800" font-size="5.6" letter-spacing="2.2" fill="#C73E78">ANGLISTYCZNIE</text>'+
  [14,36,58,80,102].map(function(x){return '<rect x="'+x+'" y="19" width="18" height="20" rx="4.5" fill="#D9F0F8"/><path d="M'+(x+3)+' 35l8-13" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>';}).join('')+
  '<rect x="126" y="19" width="44" height="11" rx="3" fill="#2F2729"/><text x="148" y="27.2" text-anchor="middle" font-family="Figtree,Arial,sans-serif" font-weight="800" font-size="6.4" letter-spacing="1.4" fill="#FFE9A8">ANGIE</text><rect x="126" y="33" width="44" height="6" rx="3" fill="#D9F0F8"/>'+
  [14,36,58,80].map(function(x){return '<rect x="'+x+'" y="58" width="18" height="17" rx="4.5" fill="#D9F0F8"/><path d="M'+(x+3)+' 72l7-11" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>';}).join('')+
  '<rect x="104" y="57" width="22" height="29" rx="4" fill="#FFF4F7"/><path d="M115 59v25" stroke="#E0607E" stroke-width="1.6"/><rect x="107" y="61" width="5.5" height="11" rx="2" fill="#D9F0F8"/><rect x="117.500" y="61" width="5.5" height="11" rx="2" fill="#D9F0F8"/>'+
  '<rect x="132" y="58" width="38" height="17" rx="4.500" fill="#D9F0F8"/><path d="M136 72l7-11" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>'+
  '<rect x="6" y="80" width="172" height="6" rx="3" fill="#C24A6B"/><circle cx="173" cy="78" r="3.4" fill="#FFE9A8"/><rect x="5" y="72" width="4" height="8" rx="2" fill="#F6A9BC"/>'+
  [46,134].map(function(x){return '<g class="wh"><circle cx="'+x+'" cy="88" r="14" fill="#2F2729"/><circle cx="'+x+'" cy="88" r="7" fill="#F3B8CB"/><path d="M'+x+' 81v14M'+(x-7)+' 88h14" stroke="#2F2729" stroke-width="1.8"/><circle cx="'+x+'" cy="88" r="2.2" fill="#2F2729"/></g>';}).join('')+
  '</svg></div>';
function drawQ(pick){
  var el=document.getElementById('qsheet');if(!el)return;
  var head='<div class="qhead"><span>Name: <i>Ty</i></span><span>Date: <i>'+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+'</i></span></div>';
  if(qi>=Q.length){el.innerHTML=head+'<div class="qres"><span class="grade">'+score+'/'+Q.length+'</span><p class="hand qfb">'+(score===Q.length?'Excellent!':score?'Good job!':'Try again!')+'</p><div class="row" style="justify-content:center"><button class="btn sm" data-q="again">Jeszcze raz</button><a class="btn sm red" href="#materialy">Darmowe materiały</a></div></div>';return;}
  var q=Q[qi],done=pick!==undefined,ok=done&&pick===q.dobra,parts=String(q.pytanie).split('___');
  var gap=!done?'<span class="gap">&nbsp;</span>':ok?'<span class="gap">'+esc(q.odp[pick])+'</span>':'<span class="gap bad"><s>'+esc(q.odp[pick])+'</s> '+esc(q.odp[q.dobra])+'</span>';
  el.innerHTML=head+'<div class="qno">Task '+(qi+1)+' / '+Q.length+(q.temat?' · '+esc(q.temat):'')+'</div><p class="qq">'+esc(parts[0])+gap+esc(parts[1]||'')+'</p>'+
    '<div class="qopts">'+q.odp.map(function(a,k){return '<button class="btn'+(done&&k===q.dobra?' right':'')+(done&&k===pick&&!ok?' wrong':'')+'" data-q="'+k+'"'+(done?' disabled':'')+'>'+esc(a)+'</button>';}).join('')+'</div>'+
    '<div class="qfoot">'+(done?'<span class="hand qfb">'+(ok?'✓ Well done!':'Not quite!')+'</span><button class="btn sm red" data-q="next">'+(qi+1<Q.length?'Next →':'Wynik →')+'</button>':'<span class="meta" style="color:var(--muted)">Wybierz odpowiedź</span>')+'</div>';
}
function enhance(){
  clearInterval(rotT);
  var r=document.getElementById('rot');
  if(r&&!RM){var words=['karty pracy','gry','pomysły na lekcje'].concat(S.strefaUcznia?['kartkówki online']:[]),i=0;
    rotT=setInterval(function(){i=(i+1)%words.length;r.textContent=words[i];r.classList.remove('swap');void r.offsetWidth;r.classList.add('swap');},1900);}
  var d=document.getElementById('desk');
  if(d&&!RM&&window.matchMedia('(hover:hover)').matches){var hero=d.closest('.hero');
    hero.addEventListener('pointermove',function(e){var b=hero.getBoundingClientRect();d.style.setProperty('--mx',((e.clientX-b.left)/b.width-.5).toFixed(3));d.style.setProperty('--my',((e.clientY-b.top)/b.height-.5).toFixed(3));});
    hero.addEventListener('pointerleave',function(){d.style.setProperty('--mx',0);d.style.setProperty('--my',0);});}
  if(document.getElementById('qsheet')){qi=0;score=0;drawQ();}
  var road=document.getElementById('road');
  if(road){if(RM||!('IntersectionObserver' in window))road.classList.add('parked');
    else new IntersectionObserver(function(en,ob){if(en[0].isIntersecting){road.classList.add('go');ob.disconnect();}},{threshold:.6}).observe(road);}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-q]');if(!b)return;var v=b.dataset.q;
  if(v==='next'){qi++;drawQ();}else if(v==='again'){qi=0;score=0;drawQ();}else{if(+v===Q[qi].dobra)score++;drawQ(+v);}
});
window.addEventListener('hashchange',route);
route();
})();
</script>
